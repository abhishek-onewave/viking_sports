# Fly.io alternative. Deploy:
#   fly launch --no-deploy --dockerfile backend/Dockerfile
#   fly deploy
app = "viking-card-model-v3"
primary_region = "sjc"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PORT = "8000"
  WEB_CONCURRENCY = "2"
  PREDICT_TIMEOUT_SECONDS = "20"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8000
  force_https = true
  # Never scale to zero: a cold start pays the 9.5 MB bundle load on the first
  # user's request, which reads as a broken page rather than a slow one.
  auto_stop_machines = false
  min_machines_running = 1

  [http_service.checks]
    [[http_service.checks.health]]
      grace_period = "90s"
      interval = "30s"
      timeout = "10s"
      method = "GET"
      path = "/api/v1/card-investment/health"

[[vm]]
  # The boosters plus pandas/numpy need real memory; 512 MB OOMs on load.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
